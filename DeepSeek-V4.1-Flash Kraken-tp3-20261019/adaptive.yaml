# Throughput preset: adaptive speculative verification for many concurrent users (5+).
# 32k, 2026-10-31: c8 611 -> 741 tok/s aggregate (+21%), c4 neutral, c1 238 -> 211 tok/s (-11%). Not the default.
# Usage: docker compose -f compose.yaml -f adaptive.yaml up -d --force-recreate      (combine with a kv-<preset>.yaml if wanted)
# Mounts ds41-launch-adaptive.yaml and points the launcher at it; everything else unchanged.
services:
  ds41-kraken-tp3:
    environment:
      DS41_LAUNCH_SETTINGS: /etc/ds41/launch-adaptive.yaml
    volumes:
      - ./ds41-launch-adaptive.yaml:/etc/ds41/launch-adaptive.yaml:ro
