# lil launcher settings for DeepSeek-V4.1-Flash-1017 at TP3 (3x RTX PRO 6000).
# Throughput variant of ds41-launch.yaml; selected by the adaptive.yaml compose overlay (DS41_LAUNCH_SETTINGS).
# Native vLLM flags (KV bytes, CPU offload) are passed after `--` by ds41-serve.
options:
  served-model-name: DeepSeek-V4.1-Flash
  tensor-parallel-size: 3
  # GPU prefix cache only. The LMCache host tier would need ~48 GiB of host RAM
  # that the layer-1 Engram table and the parked expert layers already use.
  cache-mode: vram
  max-model-len: 1048576
  # 8 concurrent decodes (was 4). Stress-tested 2026-10-31: 8 x 530K unique prompts x 2 waves oversubscribing the
  # 2x KV pool 3.9x, 16/16 ok, min free VRAM 617 MiB, 0 errors. 32k: c1 84 steps/s, c4 460 tok/s agg, c8 611 agg.
  max-num-seqs: 8
  # 4096-token prefill chunks; needs the 1 GiB promotion reserve (2048 needs 512 MiB).
  max-num-batched-tokens: 4096
  # CUDA graphs cover 8 seqs x (5 drafts + 1) = 48 decode rows. vLLM's default size list is fine: 6-aligned
  # sizes measured neutral (padded rows are free; decode is weight-read-bound).
  max-cudagraph-capture-size: 48
  # KV is a fixed byte budget (--kv-cache-memory-bytes), so this only bounds startup.
  gpu-memory-utilization: 0.93
  # Up to 4 prefills share each step round-robin; a lone prefill keeps the full budget.
  # A short request behind a ~420K-token prefill: TTFT 34-35 s with 1, 0.6 s with auto.
  max-parallel-prefills: auto
  prefill-policy: round-robin
  # THROUGHPUT PRESET (adaptive.yaml overlay). DSpark speculative decoding with 5 drafts, but adaptive
  # verification lets the engine verify fewer drafts per request when the step is crowded. Measured 2026-10-31 @32k:
  # c8 611 -> 741 tok/s aggregate (+21%), c4 neutral (460 -> 463), c1 238 -> 211 tok/s (-11%). The lone-request
  # loss is structural: the cost table is a step function over CUDA-graph sizes and a 6-row verify step really
  # costs ~25% more than a 3-row one on this hybrid-offload model (MoE decode cost tracks distinct experts read),
  # so a single request is trimmed to ~2 drafts (accept 2.3 vs 2.85). Cost scale <1 retains more drafts:
  # 1.0 = c1 172 / c8 726; 0.5 = c1 211 / c8 741 (shipped); 0.25 = c1 215 / c8 688. The default
  # (ds41-launch.yaml) keeps every draft verified: best for 1-4 users.
  mode: dspark
  draft-tokens: 5
  adaptive-verification: true
  adaptive-verification-cost-scale: 0.5
  # Server-default sampling for requests that set none: the model card's temperature 1.0 and
  # top_p 1.0 (the lil profile ships 0.95 from the older V4.1 launcher). Requests still override.
  override-generation-config: {temperature: 1.0, top_p: 1.0}
  # Engram: layer 1's table in pinned host RAM (DS41_ENGRAM_RAM_LAYERS=1), layer 14's
  # read from the checkpoint with its scales resident in host RAM and a host row cache.
  engram-table-memory: disk
  engram-disk-resident-scales: true
  jit-monitor-mode: warn
